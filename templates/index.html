{% extends "base.html" %}

{% block title %}
FitBuddy - Create Your Workout
{% endblock %}

{% block content %}

<div class="card">

    <h2>Build Your Personalized Workout Plan</h2>

    <p>
        Tell FitBuddy about yourself and your fitness goal.
        Our AI will create a personalized 7-day workout plan.
    </p>

    <h3>Your Fitness Profile</h3>

    <form action="/generate-workout" method="post">

        <label>User ID</label>
        <input
            type="text"
            name="user_id"
            placeholder="example: user001"
            required
        >

        <label>Name</label>
        <input
            type="text"
            name="name"
            placeholder="Your name"
            required
        >

        <label>Age</label>
        <input
            type="number"
            name="age"
            value="25"
            min="13"
            max="100"
            required
        >

        <label>Weight (kg)</label>
        <input
            type="number"
            name="weight_kg"
            value="70"
            step="0.1"
            min="20"
            required
        >

        <label>Fitness Goal</label>

        <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="weight loss">Weight Loss</option>
            <option value="muscle gain">Muscle Gain</option>
            <option value="general wellness">General Wellness</option>
            <option value="flexibility">Flexibility</option>
        </select>

        <label>Workout Intensity</label>

        <select name="intensity" required>
            <option value="">Select intensity</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label>Experience Level</label>

        <select name="experience">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <button type="submit">
            Generate My Workout Plan
        </button>

    </form>

</div>

{% endblock %}
